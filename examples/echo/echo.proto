syntax = "proto3";

package echo;

service Echo {
	rpc echo(EchoRequest) returns (EchoResponse) {}
    rpc spam(SpamRequest) returns (stream SpamResponse) {}
}

message EchoRequest {
	string message = 1;
}

message EchoResponse {
	string message = 1;
}

message SpamRequest {
	uint32 initial = 1;
}

message SpamResponse {
	uint32 current = 1;
}